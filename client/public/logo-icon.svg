<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc with Subtle Shadow -->
  <circle cx="60" cy="60" r="54" fill="#09131e" stroke="url(#glowGrad)" stroke-width="2.5" />
  
  <!-- Healthcare Cross with Dynamic Curved "E" / "W" Path -->
  <g filter="url(#neonGlow)">
    <!-- Vertical Medical Pillar -->
    <rect x="52" y="26" width="16" height="68" rx="8" fill="url(#glowGrad)" />
    <!-- Horizontal Cross Bar with Rounded Tips -->
    <rect x="26" y="52" width="68" height="16" rx="8" fill="url(#glowGrad)" />
    <!-- Curved Forward Way Line (Pulse / Path) -->
    <path d="M34 60 C 44 44, 76 76, 86 60" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="60" cy="60" r="4.5" fill="#ffffff" />
  </g>
</svg>
