<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="easywayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#06D6A0" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00B4D8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#glowRing)" stroke-width="3" opacity="0.4" filter="url(#neonGlow)" />
  
  <!-- Outer Shield Ring -->
  <circle cx="100" cy="100" r="76" fill="#06090e" stroke="url(#easywayGrad)" stroke-width="3.5" />

  <!-- Modern Geometric Cross with Curved Ergonomics -->
  <!-- Vertical Bar -->
  <rect x="88" y="44" width="24" height="112" rx="12" fill="url(#easywayGrad)" />
  <!-- Horizontal Bar -->
  <rect x="44" y="88" width="112" height="24" rx="12" fill="url(#easywayGrad)" />

  <!-- Central Heart Pulse Polyline (Signifying vitality and healthcare) -->
  <path d="M 52 100 L 80 100 L 92 78 L 108 122 L 120 100 L 148 100" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Glowing Core Accent Dots -->
  <circle cx="100" cy="44" r="4" fill="#00F5D4" filter="url(#neonGlow)" />
  <circle cx="100" cy="156" r="4" fill="#06D6A0" filter="url(#neonGlow)" />
  <circle cx="44" cy="100" r="4" fill="#00B4D8" filter="url(#neonGlow)" />
  <circle cx="156" cy="100" r="4" fill="#00F5D4" filter="url(#neonGlow)" />
</svg>
